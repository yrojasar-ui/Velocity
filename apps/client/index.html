<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Velocity PlayCanvas rendering bootstrap"
    />
    <title>Velocity</title>
  </head>
  <body>
    <canvas id="application" aria-label="Velocity rendering canvas"></canvas>
    <section id="control-panel" aria-label="Game controls">
      <button id="enter-controls" type="button">Click to play</button>
      <p id="control-status" aria-live="polite">
        Pointer Lock is required for movement and mouse look.
      </p>
      <p>WASD to move · Space to jump · Escape to release the pointer</p>
    </section>
    <pre id="movement-telemetry" aria-label="Movement telemetry"></pre>
    <p id="initialization-error" role="alert" hidden></p>
    <noscript
      >Velocity requires JavaScript to initialize the rendering
      engine.</noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
